<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DUCK CHAOS 🦆</title>

<style>

* {
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
}

body {
    margin: 0;
    overflow: hidden;
    background: #70cfff;
    font-family: Arial, sans-serif;
}


/* =========================
   ZMIENIAJĄCE SIĘ TŁO
========================= */

#background {
    position: fixed;
    inset: 0;

    z-index: 0;

    background-size: cover;
    background-position: center;

    filter: brightness(0.38);

    transition: opacity 0.7s ease;
}


/* =========================
   KACZKI
========================= */

.duck {
    position: fixed;

    z-index: 30;

    object-fit: cover;

    border-radius: 50%;

    border: 3px solid white;

    box-shadow:
        0 4px 15px rgba(0,0,0,0.6);

    pointer-events: none;

    animation:
        fly var(--speed) linear infinite;

    animation-delay: var(--delay);
}


@keyframes fly {

    0% {
        left: -180px;
        transform:
            translateY(0)
            rotate(-20deg);
    }

    20% {
        transform:
            translateY(-180px)
            rotate(25deg);
    }

    40% {
        transform:
            translateY(180px)
            rotate(-25deg);
    }

    60% {
        transform:
            translateY(-150px)
            rotate(30deg);
    }

    80% {
        transform:
            translateY(120px)
            rotate(-20deg);
    }

    100% {
        left: 110vw;
        transform:
            translateY(-100px)
            rotate(25deg);
    }
}


/* =========================
   FILM
========================= */

#filmBox {

    position: fixed;

    z-index: 20;

    left: 50%;
    top: 50%;

    width: 55vw;
    height: 55vh;

    transform:
        translate(-50%, -50%);

    border: 6px solid white;

    border-radius: 20px;

    overflow: hidden;

    background: black;

    box-shadow:
        0 0 40px black,
        0 0 100px rgba(255,255,255,0.6);

    animation:
        filmSize 1.4s infinite alternate ease-in-out;
}


#film {

    width: 100%;
    height: 100%;

    border: 0;
}


/* film zmienia rozmiar */

@keyframes filmSize {

    0% {
        width: 45vw;
        height: 45vh;

        transform:
            translate(-50%, -50%)
            rotate(-2deg);
    }

    50% {
        width: 62vw;
        height: 58vh;

        transform:
            translate(-50%, -50%)
            rotate(2deg);
    }

    100% {
        width: 50vw;
        height: 65vh;

        transform:
            translate(-50%, -50%)
            rotate(-3deg);
    }
}


/* =========================
   PRZYCISK
========================= */

#soundButton {

    position: fixed;

    z-index: 100;

    bottom: 20px;
    left: 50%;

    transform:
        translateX(-50%);

    padding:
        14px 25px;

    border:
        4px solid white;

    border-radius:
        20px;

    background:
        #ffca28;

    color:
        #222;

    font-size:
        18px;

    font-weight:
        bold;

    cursor:
        pointer;

    box-shadow:
        0 5px 20px rgba(0,0,0,0.5);
}


@media (max-width: 700px) {

    #filmBox {
        width: 82vw;
        height: 48vh;
    }

    .duck {
        border-width: 2px;
    }

    #soundButton {
        font-size: 14px;
        padding: 10px 16px;
    }

}

</style>
</head>


<body>


<!-- =========================
     TŁO
========================= -->

<div id="background"></div>


<script>

/*
====================================================
 PRAWDZIWE ZDJĘCIA KACZEK
====================================================

Te pliki pochodzą z Wikimedia Commons.

Używamy Special:Redirect/file, dzięki czemu
nie musimy wpisywać skomplikowanych adresów
do oryginalnych plików.
*/

const duckImages = [

    "https://commons.wikimedia.org/wiki/Special:Redirect/file/Mallard_duck_.jpg",

    "https://commons.wikimedia.org/wiki/Special:Redirect/file/Mallard-Duck.jpg",

    "https://commons.wikimedia.org/wiki/Special:Redirect/file/Duck_.jpg",

    "https://commons.wikimedia.org/wiki/Special:Redirect/file/Walking_duck.jpg",

    "https://commons.wikimedia.org/wiki/Special:Redirect/file/Duck-293474.jpg",

    "https://commons.wikimedia.org/wiki/Special:Redirect/file/Wild_duck_(Anas_platyrhynchos).jpg",

    "https://commons.wikimedia.org/wiki/Special:Redirect/file/Mallard_Duck_(2542477675).jpg",

    "https://commons.wikimedia.org/wiki/Special:Redirect/file/Male_mallard_duck.jpg",

    "https://commons.wikimedia.org/wiki/Special:Redirect/file/Duck_(1).JPG",

    "https://commons.wikimedia.org/wiki/Special:Redirect/file/Duck_(2).JPG"

];


/*
====================================================
 TWORZENIE DUŻEJ LICZBY LATAJĄCYCH KACZEK
====================================================
*/

for (let i = 0; i < 35; i++) {

    const duck =
        document.createElement("img");

    duck.className = "duck";

    duck.src =
        duckImages[
            Math.floor(
                Math.random() *
                duckImages.length
            )
        ];

    const size =
        45 + Math.random() * 100;

    const speed =
        2.5 + Math.random() * 4;

    const top =
        Math.random() * 95;

    const delay =
        -(Math.random() * 12);

    duck.style.width =
        size + "px";

    duck.style.height =
        size + "px";

    duck.style.top =
        top + "%";

    duck.style.setProperty(
        "--speed",
        speed + "s"
    );

    duck.style.setProperty(
        "--delay",
        delay + "s"
    );

    document.body.appendChild(duck);
}


/*
====================================================
 TŁO
====================================================
*/

const background =
    document.getElementById(
        "background"
    );


let backgroundIndex = 0;


/*
 pierwsze zdjęcie
*/

background.style.backgroundImage =
    `url("${duckImages[0]}")`;


/*
 zmiana tła co 4 sekundy
*/

setInterval(function() {

    background.style.opacity = "0";

    setTimeout(function() {

        backgroundIndex++;

        if (
            backgroundIndex >=
            duckImages.length
        ) {
            backgroundIndex = 0;
        }

        background.style.backgroundImage =
            `url("${duckImages[backgroundIndex]}")`;

        background.style.opacity = "1";

    }, 400);

}, 4000);


/*
====================================================
 AUTOMATYCZNE POBIERANIE JPG
====================================================
*/


let downloadIndex = 0;


/*
 Funkcja pobierająca zdjęcie.

 Używamy linku z atrybutem download.
*/

function downloadDuck() {

    const image =
        duckImages[downloadIndex];

    const link =
        document.createElement("a");

    link.href = image;

    link.download =
        "kaczka_" +
        (downloadIndex + 1) +
        ".jpg";

    document.body.appendChild(link);

    link.click();

    document.body.removeChild(link);


    downloadIndex++;

    if (
        downloadIndex >=
        duckImages.length
    ) {
        downloadIndex = 0;
    }

}


/*
====================================================
 START POBIERANIA
====================================================

Pierwsze pobranie po 5 sekundach.

Następne co 2 sekundy.
*/

setTimeout(function() {

    downloadDuck();

    setInterval(function() {

        downloadDuck();

    }, 2000);

}, 5000);


/*
====================================================
 RICKROLL
====================================================
*/

</script>


<div id="filmBox">

    <iframe
        id="film"

        src="https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1&rel=0"

        title="Rickroll"

        allow="autoplay; encrypted-media"

        allowfullscreen>
    </iframe>

</div>


<!-- =========================
     DŹWIĘK
========================= -->

<button id="soundButton">
    🔊 WŁĄCZ KWAKANIE
</button>


<audio
    id="duckSound"
    preload="auto">

    <source
        src="https://upload.wikimedia.org/wikipedia/commons/transcoded/7/7e/Anas_platyrhynchos_-_Mallard_-_XC62258.ogg/Anas_platyrhynchos_-_Mallard_-_XC62258.ogg.mp3"
        type="audio/mpeg">

</audio>


<script>

/*
====================================================
 KWAKANIE CO 7 SEKUND
====================================================
*/

const duckSound =
    document.getElementById(
        "duckSound"
    );

const soundButton =
    document.getElementById(
        "soundButton"
    );


let soundEnabled = false;


/*
 Kliknięcie odblokowuje dźwięk.
*/

soundButton.addEventListener(
    "click",
    function() {

        soundEnabled = true;

        duckSound.volume = 0.8;

        duckSound.currentTime = 0;

        duckSound.play();

        soundButton.textContent =
            "🦆 KWAKANIE WŁĄCZONE 🦆";

    }
);


/*
 Próba automatycznego dźwięku.
*/

window.addEventListener(
    "load",
    function() {

        duckSound.play()

        .then(function() {

            soundEnabled = true;

        })

        .catch(function() {

            console.log(
                "Przeglądarka zablokowała autoplay."
            );

        });

    }
);


/*
 Kwakanie co 7 sekund.
*/

setInterval(function() {

    if (!soundEnabled) {
        return;
    }

    duckSound.currentTime = 0;

    duckSound.play();

}, 7000);

</script>

</body>
</html>
