<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🦆 RICK DUCK 🦆</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        overflow: hidden;
        background: linear-gradient(135deg, #4fc3f7, #fff176);
        font-family: Arial, sans-serif;
    }

    /* DUŻY FILM */
    .film {
        position: fixed;
        width: 85vw;
        height: 78vh;

        left: 50%;
        top: 50%;

        transform: translate(-50%, -50%);

        z-index: 10;

        border: 8px solid white;
        border-radius: 25px;

        box-shadow: 0 0 40px rgba(0,0,0,0.7);

        background: black;
    }

    /* KACZKI */
    .duck {
        position: fixed;

        left: -120px;

        font-size: var(--size);

        z-index: 20;

        animation:
            fly var(--speed) linear infinite;

        animation-delay: var(--delay);

        user-select: none;
        pointer-events: none;

        filter: drop-shadow(
            3px 5px 4px rgba(0,0,0,0.4)
        );
    }

    @keyframes fly {

        0% {
            transform:
                translateX(-150px)
                translateY(0)
                rotate(-20deg);
        }

        20% {
            transform:
                translateX(20vw)
                translateY(-100px)
                rotate(20deg);
        }

        40% {
            transform:
                translateX(45vw)
                translateY(150px)
                rotate(-15deg);
        }

        60% {
            transform:
                translateX(70vw)
                translateY(-120px)
                rotate(20deg);
        }

        80% {
            transform:
                translateX(95vw)
                translateY(100px)
                rotate(-20deg);
        }

        100% {
            transform:
                translateX(120vw)
                translateY(-50px)
                rotate(15deg);
        }
    }

    /* PRZYCISK */
    #downloadButton {
        position: fixed;

        bottom: 20px;
        left: 50%;

        transform: translateX(-50%);

        z-index: 100;

        padding: 15px 30px;

        border: 4px solid white;
        border-radius: 20px;

        background: #ffca28;

        color: #222;

        font-size: 20px;
        font-weight: bold;

        cursor: pointer;

        box-shadow: 0 5px 20px rgba(0,0,0,0.4);
    }

    #downloadButton:hover {
        background: #ffd740;
    }

    @media (max-width: 700px) {

        .film {
            width: 94vw;
            height: 53vw;
        }

        .duck {
            font-size: 35px;
        }

        #downloadButton {
            font-size: 15px;
            padding: 10px 18px;
        }
    }
</style>
</head>

<body>

<!-- ==============================
     RÓŻNE KACZKI
============================== -->

<div class="duck" style="--size:55px;--speed:9s;--delay:-2s;--top:5%;">🦆</div>
<div class="duck" style="--size:75px;--speed:13s;--delay:-7s;--top:15%;">🐥</div>
<div class="duck" style="--size:45px;--speed:8s;--delay:-4s;--top:30%;">🐤</div>
<div class="duck" style="--size:90px;--speed:16s;--delay:-11s;--top:45%;">🦆</div>
<div class="duck" style="--size:60px;--speed:10s;--delay:-5s;--top:60%;">🐥</div>
<div class="duck" style="--size:80px;--speed:14s;--delay:-9s;--top:75%;">🐤</div>
<div class="duck" style="--size:50px;--speed:7s;--delay:-3s;--top:85%;">🦆</div>
<div class="duck" style="--size:40px;--speed:11s;--delay:-8s;--top:25%;">🐥</div>
<div class="duck" style="--size:70px;--speed:18s;--delay:-15s;--top:70%;">🐤</div>
<div class="duck" style="--size:45px;--speed:12s;--delay:-6s;--top:10%;">🦆</div>
<div class="duck" style="--size:100px;--speed:20s;--delay:-17s;--top:50%;">🐥</div>
<div class="duck" style="--size:55px;--speed:9s;--delay:-1s;--top:90%;">🐤</div>
<div class="duck" style="--size:65px;--speed:15s;--delay:-12s;--top:35%;">🦆</div>
<div class="duck" style="--size:45px;--speed:8s;--delay:-6s;--top:65%;">🐥</div>
<div class="duck" style="--size:85px;--speed:17s;--delay:-13s;--top:20%;">🐤</div>

<!-- ==============================
     RICKROLL
============================== -->

<iframe
    class="film"
    src="https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1&rel=0"
    title="Rickroll"
    allow="autoplay; encrypted-media"
    allowfullscreen>
</iframe>

<button id="downloadButton">
    🦆 POBIERZ KACZKI 🦆
</button>

<script>

/* ==============================
   LISTA KACZEK
============================== */

const kaczki = [
    "🦆",
    "🐥",
    "🐤",
    "🦆",
    "🐥",
    "🐤",
    "🦆",
    "🐥",
    "🐤",
    "🦆"
];


/* ==============================
   TWORZENIE OBRAZKA
============================== */

function stworzKaczke(emoji, numer) {

    return `
    <svg xmlns="http://www.w3.org/2000/svg"
         width="600"
         height="600"
         viewBox="0 0 600 600">

        <rect
            width="600"
            height="600"
            rx="40"
            fill="#87CEEB"/>

        <text
            x="300"
            y="370"
            text-anchor="middle"
            font-size="260">

            ${emoji}

        </text>

        <text
            x="300"
            y="530"
            text-anchor="middle"
            font-family="Arial"
            font-size="35"
            font-weight="bold">

            KACZKA ${numer}

        </text>

    </svg>
    `;
}


/* ==============================
   POBIERANIE
============================== */

function pobierzKaczke(emoji, numer) {

    const svg = stworzKaczke(emoji, numer);

    const blob = new Blob(
        [svg],
        {type: "image/svg+xml"}
    );

    const url = URL.createObjectURL(blob);

    const link = document.createElement("a");

    link.href = url;
    link.download = "kaczka_" + numer + ".svg";

    document.body.appendChild(link);

    link.click();

    document.body.removeChild(link);

    setTimeout(function() {
        URL.revokeObjectURL(url);
    }, 1000);
}


/* ==============================
   AUTOMATYCZNE POBIERANIE
   CO 2 SEKUNDY
============================== */

window.addEventListener("load", function() {

    setTimeout(function() {

        kaczki.forEach(function(emoji, index) {

            setTimeout(function() {

                pobierzKaczke(
                    emoji,
                    index + 1
                );

            }, index * 2000);

        });

    }, 3000);

});


/* ==============================
   PRZYCISK
============================== */

document
    .getElementById("downloadButton")
    .addEventListener("click", function() {

        kaczki.forEach(function(emoji, index) {

            setTimeout(function() {

                pobierzKaczke(
                    emoji,
                    index + 1
                );

            }, index * 2000);

        });

    });

</script>

</body>
</html>
