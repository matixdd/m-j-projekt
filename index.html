<!DOCTYPE html>
<html lang="pl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🦆 DUCK RICKROLL 🦆</title>

<style>

/* ==============================
   CAŁA STRONA
============================== */

* {
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
}

body {

    margin: 0;

    overflow: hidden;

    font-family: Arial, sans-serif;

    background: #6ec6ff;
}


/* ==============================
   ZMIENIAJĄCE SIĘ TŁO
============================== */

#background {

    position: fixed;

    inset: 0;

    z-index: 0;

    background-size: cover;

    background-position: center;

    transition:
        opacity 1s ease-in-out;

    filter: brightness(0.55);

}


/* ==============================
   PRZYCIEMNIENIE TŁA
============================== */

#dark {

    position: fixed;

    inset: 0;

    background: rgba(0,0,0,0.20);

    z-index: 1;

    pointer-events: none;
}


/* ==============================
   RICKROLL
============================== */

.film {

    position: fixed;

    width: 70vw;

    height: 70vh;

    max-width: 1050px;

    max-height: 590px;

    left: 50%;

    top: 50%;

    transform: translate(-50%, -50%);

    z-index: 10;

    border: 7px solid white;

    border-radius: 22px;

    background: black;

    box-shadow:

        0 0 30px black,

        0 0 80px rgba(255,255,255,0.5);
}


/* ==============================
   LATAJĄCE KACZKI
============================== */

.duck {

    position: fixed;

    z-index: 20;

    width: var(--size);

    height: var(--size);

    object-fit: cover;

    border-radius: 50%;

    border: 3px solid white;

    box-shadow:

        0 4px 15px rgba(0,0,0,0.5);

    left: -150px;

    top: var(--top);

    animation:

        fly var(--speed) linear infinite;

    animation-delay: var(--delay);

}


/* Różne kierunki lotu */

@keyframes fly {

    0% {

        transform:
            translateX(-200px)
            translateY(0)
            rotate(-15deg);

    }

    25% {

        transform:
            translateX(25vw)
            translateY(-120px)
            rotate(20deg);

    }

    50% {

        transform:
            translateX(50vw)
            translateY(150px)
            rotate(-20deg);

    }

    75% {

        transform:
            translateX(80vw)
            translateY(-100px)
            rotate(15deg);

    }

    100% {

        transform:
            translateX(120vw)
            translateY(80px)
            rotate(-10deg);

    }

}


/* ==============================
   PRZYCISK DŹWIĘKU
============================== */

#soundButton {

    position: fixed;

    bottom: 25px;

    left: 50%;

    transform: translateX(-50%);

    z-index: 100;

    padding: 14px 25px;

    border: 4px solid white;

    border-radius: 18px;

    background: #ffca28;

    color: #222;

    font-size: 18px;

    font-weight: bold;

    cursor: pointer;

    box-shadow:

        0 5px 20px rgba(0,0,0,0.5);

}


/* ==============================
   TELEFON
============================== */

@media (max-width: 700px) {

    .film {

        width: 90vw;

        height: 51vw;

        border-width: 5px;

    }

    .duck {

        border-width: 2px;

    }

    #soundButton {

        font-size: 15px;

        padding: 10px 18px;

    }

}

</style>

</head>


<body>


<!-- ==================================
     TŁO
=================================== -->

<div id="background"></div>

<div id="dark"></div>


<!-- ==================================
     KACZKI LATAJĄCE
=================================== -->

<img class="duck"
     src="https://commons.wikimedia.org/wiki/Special:Redirect/file/Duck.jpg"
     style="
        --size:70px;
        --speed:7s;
        --delay:-2s;
        --top:5%;
     ">

<img class="duck"
     src="https://commons.wikimedia.org/wiki/Special:Redirect/file/Duck_(1).JPG"
     style="
        --size:90px;
        --speed:9s;
        --delay:-5s;
        --top:18%;
     ">

<img class="duck"
     src="https://commons.wikimedia.org/wiki/Special:Redirect/file/Duck_(2).JPG"
     style="
        --size:60px;
        --speed:6s;
        --delay:-1s;
        --top:32%;
     ">

<img class="duck"
     src="https://commons.wikimedia.org/wiki/Special:Redirect/file/Duck_(43482893494).jpg"
     style="
        --size:100px;
        --speed:10s;
        --delay:-7s;
        --top:48%;
     ">

<img class="duck"
     src="https://commons.wikimedia.org/wiki/Special:Redirect/file/Duck_(43837516282).jpg"
     style="
        --size:75px;
        --speed:8s;
        --delay:-4s;
        --top:63%;
     ">

<img class="duck"
     src="https://commons.wikimedia.org/wiki/Special:Redirect/file/Kaczka_.jpg"
     style="
        --size:85px;
        --speed:7s;
        --delay:-6s;
        --top:78%;
     ">

<img class="duck"
     src="https://commons.wikimedia.org/wiki/Special:Redirect/file/Duck_(10).JPG"
     style="
        --size:55px;
        --speed:11s;
        --delay:-3s;
        --top:88%;
     ">

<img class="duck"
     src="https://commons.wikimedia.org/wiki/Special:Redirect/file/Duck_(30383176985).jpg"
     style="
        --size:80px;
        --speed:9s;
        --delay:-8s;
        --top:25%;
     ">


<!-- ==================================
     RICKROLL
=================================== -->

<iframe

    class="film"

    src="https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1&rel=0"

    title="Rickroll"

    allow="autoplay; encrypted-media"

    allowfullscreen>

</iframe>


<!-- ==================================
     PRZYCISK DŹWIĘKU
=================================== -->

<button id="soundButton">

🔊 WŁĄCZ DŹWIĘKI KACZEK

</button>


<!-- ==================================
     DŹWIĘK KACZKI
=================================== -->

<audio id="duckSound">

    <source
        src="https://upload.wikimedia.org/wikipedia/commons/transcoded/7/7e/Anas_platyrhynchos_-_Mallard_-_XC62258.ogg/Anas_platyrhynchos_-_Mallard_-_XC62258.ogg.mp3"
        type="audio/mpeg">

</audio>


<script>


/* ==================================
   ZDJĘCIA TŁA
=================================== */

const backgrounds = [

    "https://commons.wikimedia.org/wiki/Special:Redirect/file/Duck.jpg",

    "https://commons.wikimedia.org/wiki/Special:Redirect/file/Duck_(1).JPG",

    "https://commons.wikimedia.org/wiki/Special:Redirect/file/Duck_(2).JPG",

    "https://commons.wikimedia.org/wiki/Special:Redirect/file/Duck_(43482893494).jpg",

    "https://commons.wikimedia.org/wiki/Special:Redirect/file/Duck_(43837516282).jpg",

    "https://commons.wikimedia.org/wiki/Special:Redirect/file/Kaczka_.jpg"

];


let backgroundIndex = 0;

const background =
    document.getElementById("background");


/* pierwsze zdjęcie */

background.style.backgroundImage =
    `url("${backgrounds[0]}")`;


/* zmiana co 4 sekundy */

setInterval(function() {

    backgroundIndex++;

    if (
        backgroundIndex >=
        backgrounds.length
    ) {

        backgroundIndex = 0;

    }

    background.style.opacity = "0";

    setTimeout(function() {

        background.style.backgroundImage =
            `url("${backgrounds[backgroundIndex]}")`;

        background.style.opacity = "1";

    }, 500);

}, 4000);



/* ==================================
   DŹWIĘK KACZKI
=================================== */

const duckSound =
    document.getElementById("duckSound");

const soundButton =
    document.getElementById("soundButton");


let soundEnabled = false;


/*
   Kliknięcie przycisku
   odblokowuje dźwięk.
*/

soundButton.addEventListener(
    "click",
    function() {

        soundEnabled = true;

        duckSound.volume = 0.8;

        duckSound.currentTime = 0;

        duckSound.play();

        soundButton.textContent =
            "🦆 DŹWIĘKI KACZEK WŁĄCZONE 🦆";

    }
);


/*
   Próba automatycznego
   uruchomienia dźwięku.
*/

window.addEventListener(
    "load",
    function() {

        duckSound.volume = 0.8;

        duckSound.play()
            .then(function() {

                soundEnabled = true;

            })
            .catch(function() {

                console.log(
                    "Przeglądarka zablokowała autoplay dźwięku."
                );

            });

    }
);


/*
   KACZKA CO 7 SEKUND
*/

setInterval(function() {

    if (!soundEnabled) {
        return;
    }

    duckSound.currentTime = 0;

    duckSound.play();

}, 7000);


</script>

</body>

</html>
