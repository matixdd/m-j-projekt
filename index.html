<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🦆 DUCK CHAOS 🦆</title>

<style>

/* =====================================================
   PODSTAWY
===================================================== */

* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
}

body {
    overflow: hidden;
    background: #65c9ff;
    font-family: Arial, sans-serif;
}


/* =====================================================
   TŁO
===================================================== */

#background {
    position: fixed;

    left: 0;
    top: 0;

    width: 100vw;
    height: 100vh;

    z-index: 0;

    background-size: cover;
    background-position: center;

    filter: brightness(0.38);

    opacity: 1;

    transition: opacity 0.8s ease;
}


/* =====================================================
   LATAJĄCE KACZKI
===================================================== */

.duck {
    position: fixed;

    z-index: 30;

    object-fit: cover;

    border-radius: 50%;

    border: 3px solid white;

    box-shadow:
        0 4px 18px rgba(0, 0, 0, 0.65);

    pointer-events: none;

    user-select: none;

    will-change: transform;

    animation:
        duckFlight var(--speed) linear infinite;

    animation-delay: var(--delay);
}


/*
   Kaczka przelatuje przez CAŁY ekran.
*/

@keyframes duckFlight {

    0% {
        left: -180px;

        transform:
            translate3d(0, 0, 0)
            rotate(-15deg);
    }

    20% {
        transform:
            translate3d(20vw, -14vh, 0)
            rotate(25deg);
    }

    40% {
        transform:
            translate3d(42vw, 15vh, 0)
            rotate(-30deg);
    }

    60% {
        transform:
            translate3d(64vw, -12vh, 0)
            rotate(25deg);
    }

    80% {
        transform:
            translate3d(86vw, 12vh, 0)
            rotate(-25deg);
    }

    100% {
        left: 115vw;

        transform:
            translate3d(0, -8vh, 0)
            rotate(30deg);
    }
}


/* =====================================================
   FILM
===================================================== */

#filmBox {

    position: fixed;

    z-index: 20;

    left: 0;
    top: 0;

    width: 40vw;
    height: 40vh;

    border: 6px solid white;

    border-radius: 20px;

    overflow: hidden;

    background: black;

    box-shadow:
        0 0 40px black,
        0 0 100px rgba(255, 255, 255, 0.7);

    transform-origin: center center;

    /*
       Prawdziwy ruch po ekranie.
       Zmieniamy X, Y oraz Z.
    */

    animation:
        filmFlight 5s linear infinite;

    will-change: transform;
}


#film {

    width: 100%;
    height: 100%;

    border: 0;

    display: block;
}


/* =====================================================
   RUCH FILMU — X + Y + Z
===================================================== */

@keyframes filmFlight {

    /*
       LEWY GÓRNY
    */

    0% {

        transform:
            translate3d(-10vw, 5vh, 0)
            scale(0.55)
            rotate(-7deg);
    }


    /*
       PRAWA GÓRA
    */

    12.5% {

        transform:
            translate3d(65vw, 4vh, 0)
            scale(1.10)
            rotate(7deg);
    }


    /*
       LEWA ŚRODKOWA
    */

    25% {

        transform:
            translate3d(-8vw, 25vh, 0)
            scale(0.65)
            rotate(-10deg);
    }


    /*
       PRAWA ŚRODKOWA
    */

    37.5% {

        transform:
            translate3d(68vw, 30vh, 0)
            scale(1.25)
            rotate(10deg);
    }


    /*
       LEWY DÓŁ
    */

    50% {

        transform:
            translate3d(-10vw, 55vh, 0)
            scale(0.60)
            rotate(-8deg);
    }


    /*
       PRAWY DÓŁ
    */

    62.5% {

        transform:
            translate3d(65vw, 60vh, 0)
            scale(1.20)
            rotate(8deg);
    }


    /*
       LEWY ŚRODEK
    */

    75% {

        transform:
            translate3d(-7vw, 38vh, 0)
            scale(1.30)
            rotate(-12deg);
    }


    /*
       PRAWA GÓRA
    */

    87.5% {

        transform:
            translate3d(70vw, 12vh, 0)
            scale(0.55)
            rotate(12deg);
    }


    /*
       WRACA NA LEWO
    */

    100% {

        transform:
            translate3d(-10vw, 5vh, 0)
            scale(0.55)
            rotate(-7deg);
    }
}


/* =====================================================
   PRZYCISK DŹWIĘKU
===================================================== */

#soundButton {

    position: fixed;

    z-index: 100;

    left: 50%;
    bottom: 20px;

    transform:
        translateX(-50%);

    padding:
        14px 25px;

    border:
        4px solid white;

    border-radius:
        20px;

    background:
        #ffca28;

    color:
        #222;

    font-size:
        18px;

    font-weight:
        bold;

    cursor:
        pointer;

    box-shadow:
        0 5px 20px rgba(0, 0, 0, 0.5);
}


#soundButton:hover {

    transform:
        translateX(-50%)
        scale(1.08);
}


/* =====================================================
   MAŁE EKRANY
===================================================== */

@media (max-width: 700px) {

    #filmBox {

        width: 65vw;
        height: 38vh;

    }

    .duck {

        border-width: 2px;

    }

    #soundButton {

        font-size: 14px;

        padding:
            10px 16px;
    }
}

</style>
</head>


<body>


<!-- ===================================================
     TŁO
==================================================== -->

<div id="background"></div>


<script>

/* =====================================================
   ZDJĘCIA KACZEK

   UWAGA:
   Są to zwykłe adresy obrazów.
   Nie używamy tutaj <a download>.
   Nie powodują więc przekierowania strony.
===================================================== */

const duckImages = [

    "https://commons.wikimedia.org/wiki/Special:Redirect/file/Mallard_duck_.jpg",

    "https://commons.wikimedia.org/wiki/Special:Redirect/file/Mallard-Duck.jpg",

    "https://commons.wikimedia.org/wiki/Special:Redirect/file/Mallard_duck.1.jpg",

    "https://commons.wikimedia.org/wiki/Special:Redirect/file/Mallard_Duck.JPG",

    "https://commons.wikimedia.org/wiki/Special:Redirect/file/Mallard_Duck_%282542477675%29.jpg",

    "https://commons.wikimedia.org/wiki/Special:Redirect/file/Mallard_Duck_%285729007662%29.jpg",

    "https://commons.wikimedia.org/wiki/Special:Redirect/file/Mallard_Duck_male_%284436797999%29.jpg",

    "https://commons.wikimedia.org/wiki/Special:Redirect/file/Mallard_Duck_%28Drake%29.jpg",

    "https://commons.wikimedia.org/wiki/Special:Redirect/file/Mallard_duck_3246.jpg",

    "https://commons.wikimedia.org/wiki/Special:Redirect/file/Female_mallard_duck_%281%29.jpg"

];


/* =====================================================
   TWORZENIE KACZEK
===================================================== */

const DUCK_COUNT = 40;


for (let i = 0; i < DUCK_COUNT; i++) {

    const duck =
        document.createElement("img");


    duck.className =
        "duck";


    /*
       Losowe zdjęcie.
    */

    duck.src =
        duckImages[
            Math.floor(
                Math.random() *
                duckImages.length
            )
        ];


    /*
       Jeśli zdjęcie się nie załaduje,
       ukrywamy tylko tę konkretną kaczkę.
       Strona nadal działa.
    */

    duck.onerror = function() {

        this.style.display =
            "none";

    };


    /*
       Losowy rozmiar.
    */

    const size =
        45 + Math.random() * 95;


    duck.style.width =
        size + "px";

    duck.style.height =
        size + "px";


    /*
       Losowa wysokość startowa.
    */

    duck.style.top =
        Math.random() * 95 + "%";


    /*
       Bardzo szybka prędkość:
       od 1.8 do 5 sekund.
    */

    const speed =
        1.8 + Math.random() * 3.2;


    duck.style.setProperty(
        "--speed",
        speed + "s"
    );


    /*
       Dzięki ujemnemu opóźnieniu
       kaczki są od razu rozrzucone
       po całej trasie.
    */

    const delay =
        -(Math.random() * 8);


    duck.style.setProperty(
        "--delay",
        delay + "s"
    );


    document.body.appendChild(
        duck
    );
}


/* =====================================================
   ZMIENIAJĄCE SIĘ TŁO
===================================================== */

const background =
    document.getElementById(
        "background"
    );


let backgroundIndex = 0;


/*
   Pierwsze tło.
*/

background.style.backgroundImage =
    `url("${duckImages[0]}")`;


/*
   Zmieniamy zdjęcie co 4 sekundy.
*/

setInterval(function() {

    /*
       Najpierw wygaszamy.
    */

    background.style.opacity =
        "0";


    setTimeout(function() {

        backgroundIndex++;


        if (
            backgroundIndex >=
            duckImages.length
        ) {

            backgroundIndex = 0;

        }


        background.style.backgroundImage =
            `url("${duckImages[backgroundIndex]}")`;


        background.style.opacity =
            "1";


    }, 400);

}, 4000);

</script>


<!-- ===================================================
     RICKROLL
==================================================== -->

<div id="filmBox">

    <iframe
        id="film"

        src="https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1&rel=0"

        title="Rickroll"

        allow="autoplay; encrypted-media"

        allowfullscreen>

    </iframe>

</div>


<!-- ===================================================
     PRZYCISK DŹWIĘKU
==================================================== -->

<button id="soundButton">

    🔊 WŁĄCZ KWAKANIE

</button>


<!-- ===================================================
     DŹWIĘK KACZKI
==================================================== -->

<audio
    id="duckSound"
    preload="auto">

    <source
        src="https://upload.wikimedia.org/wikipedia/commons/transcoded/7/7e/Anas_platyrhynchos_-_Mallard_-_XC62258.ogg/Anas_platyrhynchos_-_Mallard_-_XC62258.ogg.mp3"
        type="audio/mpeg">

</audio>


<script>

/* =====================================================
   DŹWIĘK
===================================================== */

const duckSound =
    document.getElementById(
        "duckSound"
    );


const soundButton =
    document.getElementById(
        "soundButton"
    );


let soundEnabled =
    false;


/*
   Kliknięcie przycisku
   odblokowuje audio.
*/

soundButton.addEventListener(
    "click",
    function() {

        soundEnabled =
            true;


        duckSound.volume =
            0.8;


        duckSound.currentTime =
            0;


        duckSound.play()
            .catch(function(error) {

                console.log(
                    "Nie udało się odtworzyć dźwięku:",
                    error
                );

            });


        soundButton.textContent =
            "🦆 KWAKANIE WŁĄCZONE 🦆";

    }
);


/*
   Próba autoplay.

   Przeglądarka może zablokować
   dźwięk bez kliknięcia.
*/

window.addEventListener(
    "load",
    function() {

        duckSound.volume =
            0.8;


        duckSound.play()

            .then(function() {

                soundEnabled =
                    true;

            })

            .catch(function() {

                /*
                   To normalne.
                   Przeglądarki często blokują
                   automatyczny dźwięk.
                */

                console.log(
                    "Autoplay dźwięku został zablokowany."
                );

            });

    }
);


/*
   KWAKANIE CO 7 SEKUND
*/

setInterval(function() {

    if (!soundEnabled) {
        return;
    }


    duckSound.currentTime =
        0;


    duckSound.play()
        .catch(function(error) {

            console.log(
                "Błąd odtwarzania:",
                error
            );

        });

}, 7000);

</script>


</body>
</html>
